name: Test Grafana dashboard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  grafana-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare monitoring configuration
        run: |
          mkdir -p /tmp/monitoring-test/provisioning/datasources
          mkdir -p /tmp/monitoring-test/provisioning/dashboards
          mkdir -p /tmp/monitoring-test/dashboards

          cat <<'EOF' > /tmp/monitoring-test/prometheus.yml
          global:
            scrape_interval: 5s

          scrape_configs:
            - job_name: last-mile-api
              static_configs:
                - targets:
                    - api:8080
          EOF

          cat <<'EOF' > /tmp/monitoring-test/provisioning/datasources/prometheus.yml
          apiVersion: 1

          datasources:
            - name: Prometheus
              uid: prometheus
              type: prometheus
              access: proxy
              url: http://prometheus:9090
              isDefault: true
          EOF

          cat <<'EOF' > /tmp/monitoring-test/provisioning/dashboards/provider.yml
          apiVersion: 1

          providers:
            - name: delivery-api
              type: file
              options:
                path: /var/lib/grafana/dashboards
          EOF

          cat <<'EOF' > /tmp/monitoring-test/dashboards/delivery-api.json
          {
            "uid": "delivery-api",
            "title": "Delivery API Overview",
            "schemaVersion": 39,
            "version": 1,
            "refresh": "10s",
            "panels": [
              {
                "id": 1,
                "title": "API request rate",
                "type": "timeseries",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 0,
                  "y": 0
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "sum(rate(delivery_api_requests_total[5m]))"
                  }
                ]
              },
              {
                "id": 2,
                "title": "Requests by route and status",
                "type": "timeseries",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 12,
                  "y": 0
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "sum by (route, status) (delivery_api_requests_total)"
                  }
                ]
              }
            ]
          }
          EOF

          chmod -R a+rX /tmp/monitoring-test

      - name: Start application, Prometheus and Grafana
        run: |
          docker network create monitoring-test

          docker build -t last-mile-api:grafana-test .

          docker run -d \
            --name api \
            --network monitoring-test \
            -p 127.0.0.1:18080:8080 \
            last-mile-api:grafana-test

          docker run -d \
            --name prometheus \
            --network monitoring-test \
            -v /tmp/monitoring-test/prometheus.yml:/etc/prometheus/prometheus.yml:ro \
            prom/prometheus:v3.15.1

          docker run -d \
            --name grafana \
            --network monitoring-test \
            -p 127.0.0.1:13000:3000 \
            -e GF_SECURITY_ADMIN_USER=admin \
            -e GF_SECURITY_ADMIN_PASSWORD=temporary-test-password \
            -v /tmp/monitoring-test/provisioning:/etc/grafana/provisioning:ro \
            -v /tmp/monitoring-test/dashboards:/var/lib/grafana/dashboards:ro \
            grafana/grafana:13.2.1-ubuntu

      - name: Verify dashboard and Prometheus data
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if curl --fail --silent \
              http://localhost:13000/api/health > /dev/null; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "Grafana did not start in time"
              exit 1
            fi

            sleep 2
          done

          for attempt in {1..20}; do
            if curl --fail --silent \
              http://localhost:18080/healthz > /dev/null; then
              break
            fi

            if [ "$attempt" -eq 20 ]; then
              echo "API did not start in time"
              exit 1
            fi

            sleep 1
          done

          curl --fail --silent \
            http://localhost:18080/deliveries/DEL-1001 > /dev/null

          echo "Checking Grafana dashboard"
          curl --fail --silent \
            -u admin:temporary-test-password \
            http://localhost:13000/api/dashboards/uid/delivery-api \
            > /tmp/dashboard-response.json

          python3 -c '
          import json

          with open("/tmp/dashboard-response.json", encoding="utf-8") as file:
              response = json.load(file)

          dashboard = response["dashboard"]
          assert dashboard["title"] == "Delivery API Overview"
          assert len(dashboard["panels"]) == 2
          print("Dashboard found:", dashboard["title"])
          print("Panels:", len(dashboard["panels"]))
          '

          echo "Checking metrics through the Grafana data source"
          for attempt in {1..30}; do
            curl --fail --silent --get \
              -u admin:temporary-test-password \
              --data-urlencode 'query=delivery_api_requests_total' \
              http://localhost:13000/api/datasources/proxy/uid/prometheus/api/v1/query \
              > /tmp/grafana-query.json

            if python3 -c '
          import json

          with open("/tmp/grafana-query.json", encoding="utf-8") as file:
              response = json.load(file)

          results = response.get("data", {}).get("result", [])
          print("Metric series found:", len(results))

          if response.get("status") != "success" or not results:
              raise SystemExit(1)
          '; then
              echo "Grafana successfully queried Prometheus"
              exit 0
            fi

            sleep 2
          done

          echo "Grafana did not receive application metrics in time"
          cat /tmp/grafana-query.json
          exit 1

      - name: Install screenshot browser
        run: |
          python3 -m venv /tmp/grafana-browser
          /tmp/grafana-browser/bin/pip install playwright
          /tmp/grafana-browser/bin/python -m playwright install --with-deps chromium

      - name: Generate traffic and capture dashboard
        run: |
          set -euo pipefail
          mkdir -p artifacts

          /tmp/grafana-browser/bin/python - <<'PY'
          import time
          import urllib.request
          from playwright.sync_api import sync_playwright, expect

          print("Generating sample API traffic for two minutes", flush=True)

          for _ in range(120):
              with urllib.request.urlopen(
                  "http://localhost:18080/deliveries/DEL-1001",
                  timeout=5,
              ) as response:
                  if response.status != 200:
                      raise RuntimeError("Sample API request failed")
              time.sleep(1)

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              context = browser.new_context(
                  viewport={"width": 1600, "height": 1000},
                  device_scale_factor=1,
              )

              login = context.request.post(
                  "http://localhost:13000/login",
                  data={
                      "user": "admin",
                      "password": "temporary-test-password",
                  },
              )
              if not login.ok:
                  raise RuntimeError(
                      f"Grafana login failed: HTTP {login.status}"
                  )

              page = context.new_page()

              try:
                  page.goto(
                      "http://localhost:13000/d/delivery-api/"
                      "delivery-api-overview"
                      "?orgId=1&from=now-5m&to=now&refresh=10s",
                      wait_until="domcontentloaded",
                      timeout=60000,
                  )

                  expect(
                      page.get_by_text("API request rate", exact=True)
                  ).to_be_visible(timeout=60000)

                  expect(
                      page.get_by_text(
                          "Requests by route and status",
                          exact=True,
                      )
                  ).to_be_visible(timeout=60000)

                  # Allow the panel queries and chart rendering to finish.
                  page.wait_for_timeout(15000)

                  page.screenshot(
                      path="artifacts/grafana-dashboard.png",
                      full_page=True,
                  )
                  print("Saved grafana-dashboard.png", flush=True)
              except Exception:
                  page.screenshot(
                      path="artifacts/grafana-capture-error.png",
                      full_page=True,
                  )
                  raise
              finally:
                  browser.close()
          PY

      - name: Upload Grafana screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grafana-dashboard-evidence
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Show diagnostics if the test fails
        if: failure()
        run: |
          docker ps -a || true
          docker logs api || true
          docker logs prometheus || true
          docker logs grafana || true

      - name: Clean up containers
        if: always()
        run: |
          docker rm -f grafana prometheus api || true
          docker network rm monitoring-test || true