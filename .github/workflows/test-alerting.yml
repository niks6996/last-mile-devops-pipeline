name: Test Prometheus alerting

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:

permissions:
  contents: read

jobs:
  alert-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Prometheus alert configuration
        run: |
          mkdir -p /tmp/alert-test

          cat <<'EOF' > /tmp/alert-test/prometheus.yml
          global:
            scrape_interval: 5s
            evaluation_interval: 5s

          rule_files:
            - /etc/prometheus/alerts.yml

          scrape_configs:
            - job_name: last-mile-api
              static_configs:
                - targets:
                    - api:8080
          EOF

          cat <<'EOF' > /tmp/alert-test/alerts.yml
          groups:
            - name: delivery-api-alerts
              rules:
                - alert: DeliveryAPIDown
                  expr: up{job="last-mile-api"} == 0
                  for: 10s
                  labels:
                    severity: critical
                  annotations:
                    summary: "Delivery API is unavailable"
                    description: "Prometheus cannot scrape the delivery API."
          EOF

          chmod -R a+rX /tmp/alert-test

      - name: Start Prometheus without the API
        run: |
          docker network create alert-test

          docker run -d \
            --name prometheus-alert-test \
            --network alert-test \
            -p 127.0.0.1:19090:9090 \
            -v /tmp/alert-test:/etc/prometheus:ro \
            prom/prometheus:v3.15.1 \
            --config.file=/etc/prometheus/prometheus.yml \
            --storage.tsdb.path=/prometheus

      - name: Verify the API-down alert fires
        run: |
          set -euo pipefail

          for attempt in {1..40}; do
            if curl --fail --silent \
              http://localhost:19090/api/v1/alerts \
              > /tmp/alerts.json; then

              if python3 -c '
          import json

          with open("/tmp/alerts.json", encoding="utf-8") as file:
              response = json.load(file)

          alerts = response.get("data", {}).get("alerts", [])
          firing = [
              alert for alert in alerts
              if alert.get("labels", {}).get("alertname") == "DeliveryAPIDown"
              and alert.get("state") == "firing"
          ]

          print("Firing DeliveryAPIDown alerts:", len(firing))
          raise SystemExit(0 if firing else 1)
          '; then
                echo "DeliveryAPIDown alert is firing"
                exit 0
              fi
            fi

            sleep 3
          done

          echo "Alert did not fire in time"
          exit 1

      - name: Start the API
        run: |
          docker build -t last-mile-api:alert-test .

          docker run -d \
            --name api \
            --network alert-test \
            last-mile-api:alert-test

      - name: Verify the alert clears after recovery
        run: |
          set -euo pipefail

          for attempt in {1..40}; do
            curl --fail --silent --get \
              --data-urlencode 'query=up{job="last-mile-api"}' \
              http://localhost:19090/api/v1/query \
              > /tmp/target-up.json

            curl --fail --silent \
              http://localhost:19090/api/v1/alerts \
              > /tmp/alerts-after-recovery.json

            if python3 -c '
          import json

          with open("/tmp/target-up.json", encoding="utf-8") as file:
              target_response = json.load(file)

          with open("/tmp/alerts-after-recovery.json", encoding="utf-8") as file:
              alert_response = json.load(file)

          targets = target_response.get("data", {}).get("result", [])
          healthy = any(float(item["value"][1]) == 1 for item in targets)

          alerts = alert_response.get("data", {}).get("alerts", [])
          firing = [
              alert for alert in alerts
              if alert.get("labels", {}).get("alertname") == "DeliveryAPIDown"
              and alert.get("state") == "firing"
          ]

          print(f"Target healthy: {healthy}; firing alerts: {len(firing)}")

          raise SystemExit(0 if healthy and not firing else 1)
          '; then
              echo "API recovered and DeliveryAPIDown alert cleared"
              exit 0
            fi

            sleep 3
          done

          echo "Alert did not clear in time"
          exit 1

      - name: Show diagnostics if the test fails
        if: failure()
        run: |
          docker ps -a || true
          docker logs prometheus-alert-test || true
          docker logs api || true
          cat /tmp/alerts.json || true
          cat /tmp/alerts-after-recovery.json || true

      - name: Clean up containers
        if: always()
        run: |
          docker rm -f api prometheus-alert-test || true
          docker network rm alert-test || true