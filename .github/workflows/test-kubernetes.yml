name: Test Kubernetes deployment

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kubernetes-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create temporary kind cluster
        uses: helm/kind-action@v1.12.0

      - name: Build and load test images
        run: |
          docker build -t last-mile-api:stage8-v1 .
          docker tag last-mile-api:stage8-v1 last-mile-api:stage8-v2
          kind load docker-image last-mile-api:stage8-v1
          kind load docker-image last-mile-api:stage8-v2

      - name: Deploy application
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("k8s/deployment.yaml").read_text()
          lines = source.splitlines()

          for index, line in enumerate(lines):
              if line.strip().startswith("image:"):
                  lines[index] = "          image: last-mile-api:stage8-v1"
                  break
          else:
              raise SystemExit("No container image found in Deployment")

          Path("/tmp/deployment-test.yaml").write_text(
              "\n".join(lines) + "\n"
          )
          PY

          kubectl apply -f /tmp/deployment-test.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/last-mile-api --timeout=180s

          ready=$(kubectl get deployment last-mile-api \
            -o jsonpath='{.status.readyReplicas}')

          test "$ready" = "2"
          kubectl get deployments,pods,services

      - name: Test Service and rollback
        run: |
          set -euo pipefail

          kubectl port-forward service/last-mile-api 18080:80 \
            > /tmp/port-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:18080/healthz; then
              echo ""
              break
            fi

            if [ "$attempt" -eq 20 ]; then
              cat /tmp/port-forward.log
              exit 1
            fi

            sleep 1
          done

          echo "Checking delivery data through the Service"
          curl --fail --silent http://localhost:18080/deliveries
          echo ""

          echo "Rolling out the second image tag"
          kubectl set image deployment/last-mile-api \
            api=last-mile-api:stage8-v2
          kubectl rollout status deployment/last-mile-api --timeout=180s

          current=$(kubectl get deployment last-mile-api \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          test "$current" = "last-mile-api:stage8-v2"

          echo "Rolling back to the first image tag"
          kubectl rollout undo deployment/last-mile-api
          kubectl rollout status deployment/last-mile-api --timeout=180s

          current=$(kubectl get deployment last-mile-api \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          test "$current" = "last-mile-api:stage8-v1"

          echo "Checking API after rollback"
          curl --fail --silent http://localhost:18080/healthz
          echo ""

          kubectl rollout history deployment/last-mile-api
          kubectl get deployments,pods,services

      - name: Show diagnostics if the test fails
        if: failure()
        run: |
          kubectl get deployments,pods,services -o wide || true
          kubectl describe deployment last-mile-api || true
          kubectl describe pods -l app=last-mile-api || true
          kubectl get events --sort-by=.lastTimestamp || true