name: Test API

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run API tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t last-mile-api:test .

      - name: Start container
        run: docker run -d --name last-mile-api -p 8080:8080 last-mile-api:test

      - name: Test container endpoints
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent http://localhost:8080/healthz; then
              echo ""
              break
            fi

            if [ "$attempt" -eq 10 ]; then
              echo "Container did not become healthy"
              docker logs last-mile-api
              exit 1
            fi

            sleep 1
          done

          curl --fail --silent http://localhost:8080/deliveries
          echo ""

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'last-mile-api:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${COMMIT_SHA}"
          docker tag last-mile-api:test "$image"
          docker push "$image"
          echo "Published image: $image"

      - name: Show container logs and stop it
        if: always()
        run: |
          docker logs last-mile-api || true
          docker rm -f last-mile-api || true